name: Build G2NRcharstats
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the Union plugin
        shell: powershell
        run: ./Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: G2NRcharstats
          path: release/G2NRcharstats.vdf
          if-no-files-found: error
